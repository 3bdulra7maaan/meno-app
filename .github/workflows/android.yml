name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/supabase-phase-2, feature/ui-ux-refresh, feature/meno-v1-2-1-pixel-match]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # android/ has only the customized source/resources; Gradle shell files are
      # not committed yet, so Flutter still has to create them for this build.
      - name: Generate missing Android project shell
        run: flutter create --platforms=android --org=com.meno.app .
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Validate admin dashboard JavaScript
        run: node --check admin/app.js
      - name: Capture final screens with bundled Almarai
        run: >-
          flutter test test/screenshot_test.dart
          --dart-define=CAPTURE_SCREENSHOTS=true
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v5
        with:
          name: meno-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v5
        with:
          name: meno-final-screenshots
          path: build/screenshots/*.png
      - name: Verify Supabase public data flow
        run: >-
          flutter test test/supabase_smoke_test.dart
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
