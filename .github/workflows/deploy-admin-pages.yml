name: Deploy Meno website and Admin to Pages

on:
  push:
    branches: [main]
    paths:
      - admin/**
      - assets/brand/**
      - assets/fonts/**
      - docs/**
      - .github/workflows/deploy-admin-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build public Pages bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

          rm -rf dist
          mkdir -p dist/admin dist/assets/brand dist/assets/fonts
          cp -R docs/. dist/
          cp admin/index.html admin/styles.css admin/app.js dist/admin/
          cp assets/brand/meno-*.png dist/assets/brand/
          cp assets/fonts/Almarai-*.ttf dist/assets/fonts/

          node <<'NODE'
          const fs = require('fs');
          const rawUrl = process.env.SUPABASE_URL.trim().replace(/\/+$/, '');
          const supabaseUrl = rawUrl.replace(/\/rest\/v1$/, '');
          const config = {
            supabaseUrl,
            supabaseAnonKey: process.env.SUPABASE_ANON_KEY,
          };
          fs.writeFileSync(
            'dist/admin/config.js',
            `window.MENO_CONFIG = ${JSON.stringify(config)};\n`,
          );
          NODE

          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/admin/config.js
          test ! -e dist/admin/real_flow_smoke.mjs
          ! grep -R --fixed-strings "SUPABASE_ADMIN_EMAIL" dist
          ! grep -R --fixed-strings "SUPABASE_ADMIN_PASSWORD" dist
          ! grep -R --fixed-strings "service_role" dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
