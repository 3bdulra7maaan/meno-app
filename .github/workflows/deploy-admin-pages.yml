name: Meno website and admin
on:
  push:
    branches: [main]
    paths: ['docs/**', 'admin/**', 'assets/fonts/**', 'scripts/**', '.github/workflows/deploy-admin-pages.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --check admin/app.js
      - run: node --test scripts/release.test.mjs
      - name: Build website and admin together
        run: node scripts/build-pages.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify HTTPS routes
        run: |
          for route in '' admin/ privacy.html; do
            curl --retry 6 --retry-delay 10 --retry-all-errors --fail --silent --show-error "https://3bdulra7maaan.github.io/meno-app/$route" -o /tmp/page.html
            test -s /tmp/page.html
          done
