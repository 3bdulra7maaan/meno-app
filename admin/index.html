<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>إدارة Meno</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="login-view" class="login-shell">
    <form id="login-form" class="login-card">
      <img class="brand-logo" src="../assets/brand/meno-wordmark.png" alt="Meno">
      <h1>لوحة الإدارة</h1>
      <p>سجّل الدخول بحساب إداري مصرح له.</p>
      <label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label>
      <label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">تسجيل الدخول</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="app-view" class="app" hidden>
    <header><strong>الإدارة والتحليلات</strong><span class="admin-state">حساب إداري مصرح</span><button id="logout" class="quiet">خروج</button></header>
    <nav aria-label="أقسام لوحة الإدارة">
      <img class="sidebar-logo" src="../assets/brand/meno-wordmark-on-dark.png" alt="Meno">
      <button data-view="dashboard" class="active">الملخص</button>
      <button data-view="pending">قيد المراجعة</button>
      <button data-view="approved">المعتمدة</button>
      <button data-view="rejected">المرفوضة</button>
      <button data-view="reports">البلاغات</button>
      <button data-view="answers">الإجابات</button>
      <button data-view="blocked">الكلمات المحظورة</button>
      <button data-view="banners">البنرات</button>
    </nav>
    <section id="dashboard" class="page">
      <div class="section-title"><h1>ملخص اليوم</h1><button id="refresh" class="quiet">تحديث</button></div>
      <div id="metrics" class="metrics"></div>
      <div class="grid">
        <article><h2>أكثر الأقسام مشاهدة</h2><div id="categories" class="bars"></div></article>
        <article><h2>النشاط خلال 14 يوماً</h2><div id="days" class="bars"></div></article>
      </div>
      <div class="grid">
        <article><h2>أحدث الأسئلة</h2><div id="recent-questions"></div></article>
        <article><h2>أحدث الإجابات</h2><div id="recent-answers"></div></article>
      </div>
    </section>
    <section id="questions" class="page" hidden>
      <div class="section-title"><h1 id="questions-title"></h1><span id="questions-count"></span></div>
      <div id="questions-list" class="list"></div>
    </section>
    <section id="reports" class="page" hidden>
      <div class="section-title"><h1>البلاغات</h1><button class="quiet" data-reload="reports">تحديث</button></div>
      <div id="reports-list" class="list"></div>
    </section>
    <section id="answers" class="page" hidden>
      <div class="section-title"><h1>كل الإجابات</h1><span id="answers-count"></span></div>
      <div class="filters"><input id="answers-search" type="search" placeholder="ابحث في الإجابات أو السؤال"><select id="answers-filter"><option value="all">الكل</option><option value="visible">الظاهرة</option><option value="hidden">المخفية</option></select></div>
      <div id="answers-list" class="list"></div>
    </section>
    <section id="blocked" class="page" hidden>
      <div class="section-title"><h1>الكلمات المحظورة</h1><span>للإدارة فقط</span></div>
      <form id="blocked-form" class="inline-form"><input id="blocked-word" required minlength="2" maxlength="100" placeholder="أضف كلمة أو عبارة"><select id="blocked-category"><option value="abuse">إساءة</option><option value="racism">عنصرية</option><option value="spam">Spam</option><option value="other">أخرى</option></select><button type="submit">إضافة</button></form>
      <div id="blocked-list" class="list"></div>
    </section>
    <section id="banners" class="page" hidden>
      <div class="section-title"><h1>بنرات الرئيسية</h1><button id="new-banner" class="quiet">بنر جديد</button></div>
      <form id="banner-form" class="editor-form" hidden>
        <input id="banner-id" type="hidden">
        <label>العنوان<input id="banner-title" required maxlength="100"></label>
        <label>النص القصير<textarea id="banner-text" maxlength="240"></textarea></label>
        <label>صورة البنر<input id="banner-image-file" type="file" accept="image/png,image/jpeg,image/webp"></label>
        <input id="banner-image" type="hidden">
        <div id="banner-upload-progress" class="upload-progress" hidden><div></div><span>جاري رفع الصورة… 0%</span></div>
        <div class="filters"><label>وجهة البنر<select id="banner-target-type"><option value="none">بدون إجراء</option><option value="internal">صفحة تفاصيل داخل التطبيق</option><option value="external">رابط خارجي</option></select></label><label id="banner-target-wrap" hidden>الرابط الخارجي HTTPS<input id="banner-target" type="url" inputmode="url" placeholder="https://"></label></div>
        <div class="filters"><label>النوع<select id="banner-type"><option value="announcement">إعلان عام</option><option value="promotion">ترويج</option><option value="ad">إعلان مدفوع</option></select></label><label>الترتيب<input id="banner-order" type="number" min="0" value="0"></label><label>يبدأ<input id="banner-start" type="datetime-local"></label><label>ينتهي<input id="banner-end" type="datetime-local"></label></div>
        <label class="check"><input id="banner-enabled" type="checkbox" checked> مفعّل</label>
        <div id="banner-preview" class="banner-preview"></div>
        <div class="actions"><button type="submit">حفظ</button><button type="button" id="cancel-banner" class="quiet">إلغاء</button></div>
      </form>
      <div id="banners-list" class="list"></div>
    </section>
    <dialog id="question-dialog"><div id="question-detail"></div><button id="close-dialog" class="quiet">إغلاق</button></dialog>
    <div id="toast" role="status"></div>
  </div>
  <script src="config.js"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
